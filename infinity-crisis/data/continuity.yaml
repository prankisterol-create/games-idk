# Character continuity sheet, tracked per sequence, plus shot-level events.
#
# For each sequence: every principal who appears (or is present off screen) has a state at
# sequence START. `events` change state at a specific shot; the storyboard prints the
# resulting state for every shot, and tools/qc_shots.py enforces:
#   - a character appears only in shots whose location is on their `path`, visited in order
#     (no teleporting between cuts; cross-cut zones keep each character in one place)
#   - damage never decreases (there are no repair events in this film)
#   - a character marked `status: gone` (or not listed) never appears in a shot
#   - equipment changes are explicit events (no prop vanishes without a cause)
#
# damage: 0 pristine, 1 scuffed / dust, 2 visibly damaged (tears, dents, scorch), 3 heavily damaged
# power: rough percentage of usable power or stamina at sequence start

