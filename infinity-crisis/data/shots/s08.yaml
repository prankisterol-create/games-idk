  camera: Extreme wide, 40,000 km from the Engine, slightly below the ring plane.
  lens: 35 mm.
  movement: Very slow push.
  framing: >
    The shattered world lower third; the Engine above it filling two-thirds of frame; a
    drifting rock lower left where the portal opens, the heroes a few pixels tall.
  action: Strange's portal opens on a drifting rock; the heroes step through, dwarfed by everything.
  lighting: Violet-white core light, cold starlight, rim on the rings.
  environment: Rings turning slowly; floating rock; lightning tracing invisible geometric pathways.
  vfx: Gravitational lensing of the star field around the core, ring rotation, path lightning.
  sound: Vast low resonance; choir; total sense of space.
  dialogue: []
  transition: Cut.

