sequence: 8
title: THE WAR FOR REALITY
target: 103.5
music: "8M1 'The War for Reality' (full orchestra, choir, tick motif as a metronome under everything; each movement keeps its team's colour; total silence at the strike)"
purpose: >
  The largest set piece, kept legible by geography: the Crown is up, the Root is down, the
  Heart is in the middle, and Thanos's position is established in the first shot. Four
  movements, each with a clear objective. Wide shots alternate with close character
  decisions. Everything pays off on one beat of the count.
locations: [ENGINE_EXT, RINGS, GAP, CROWN, ROOT_GATE, PASSAGE, CORRIDOR_T, HEART]
