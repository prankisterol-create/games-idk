- id: S11_100
  scene: "11.1"
  title: Superman opens the shell
  dur: 4.0
  location: WRECKAGE
  characters: [SUPERMAN, IRONMAN]
  camera: Medium-wide, 4 m.
  lens: 35 mm.
  movement: Slow push.
  framing: Superman kneeling at a crumpled, smoking nanotech shell.
  action: Superman grips the shell's edges and pulls it open; inside, Tony coughs, blinks, alive.
  lighting: Starlight; smoke backlit by Earth glow.
  environment: Smoke curling out of the shell.
  vfx: Nanotech shell deformation, smoke.
  sound: Metal tearing, a cough.
  dialogue:
  - {who: TONY, line: "Did it work?"}
  - {who: SUPERMAN, line: "It worked."}
  transition: Cut.

