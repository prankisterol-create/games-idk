sequence: 11
title: THE AFTERMATH
target: 55.5
music: "11M1 'Same Responsibility' (silence > solo strings > restrained hopeful resolution of the merged theme > one Thanos-motif note under the spark > silence for titles)"
purpose: >
  Let the cost show. Resolve the immediate conflict, confirm Tony's survival with the
  payoff of his defensive systems (set up in S10_080), deliver the thematic exchange, and
  leave one credible spark of future danger.
locations: [WRECKAGE, VOID]
shots:

- id: S11_010
  scene: "11.1"
  title: Wreckage
  dur: 4.0
  location: WRECKAGE
  characters: []
  camera: Wide, low, 30 m, across the wreckage field.
  lens: 24 mm.
  movement: Fade up from black over 1.5 s; very slow push.
  framing: Twisted ring fragments across dead stone; glowing dust settling.
  action: Light slowly returns. Nothing moves except the dust.
  lighting: Cold starlight, faint residual violet glow on metal edges.
  environment: Glowing dust settling like snow.
  vfx: Dust particles, residual glow.
  sound: Silence, then a faint wind of thin air.
  dialogue: []
  transition: Cut.

