  dur: 4.0
  location: WRECKAGE
  characters: [CAP, IRONMAN, THOR, HULK, STRANGE, SPIDEY, PANTHER, SUPERMAN, BATMAN, WW, FLASH, GL, AQUAMAN, CYBORG]
  camera: Starts 20 m from the group, pulls back to 50,000 km.
  lens: 35 mm.
  movement: Exponential pull-back.
  framing: Heroes shrink to a point; the wreckage, the shattered world, Earth, the stars.
