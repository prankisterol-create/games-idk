  location: WRECKAGE
  characters: [CAP]
  camera: Extreme close-up, 0.5 m.
  lens: 85 mm.
  movement: Locked.
  framing: Steve's eyes; dust drifting across.
  action: Steve's eyes open.
  lighting: Cold starlight.
  environment: Dust drifting.
  vfx: Dust.
  sound: His breath.
  dialogue: []
  transition: Cut.

- id: S11_030
  scene: "11.1"
  title: Earth in the seam
  dur: 3.5
  location: WRECKAGE
  characters: []
  camera: Low, looking up, 2 m.
  lens: 35 mm.
  movement: Slow tilt up.
  framing: Black sky; the last thin seam of the closing rift; Earth small and blue inside it.
  action: The Engine is gone; the fractures have closed; Earth hangs in the black.
  lighting: Earth's blue atmospheric glow.
  environment: Stars steady (no more lensing).
  vfx: Seam, Earth with atmosphere glow.
  sound: Solo strings, very soft.
  dialogue: []
  transition: Cut.

