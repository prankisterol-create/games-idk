sequence: 7
title: THE PLAN
target: 48.0
music: "7M1 'The Count' (silence > solo piano > low string motif > building determination; the tick motif is introduced)"
purpose: >
  Turn defeat into a plan the audience can follow: three anchors, an order, a half-second
  window, a clock Thanos cannot read, and three teams whose failure is interdependent.
  Every hero is visibly damaged; nobody has been cleaned up.
locations: [BUNKER]
shots:

- id: S07_010
  scene: "7.1"
  title: Regroup
  dur: 4.0
  location: BUNKER
  characters: [IRONMAN, SUPERMAN, WW, FLASH, HULK, SPIDEY, CAP, THOR, STRANGE, BATMAN, CYBORG, GL, AQUAMAN, PANTHER]
  camera: Wide, 2.5 m high, from a corner of the bunker.
  lens: 24 mm.
  movement: Slow push across the room.
  framing: Heroes scattered through the room; dead screens; water dripping in the foreground.
  action: The heroes regroup. Tony sits with his helmet off, armor scorched; Superman's cape torn; Diana's shield dented; Flash against the wall, legs trembling; Hulk on the floor; Spider-Man's mask pushed up.
  lighting: Red emergency lights, flickering fluorescents, a few live screens.
  environment: Water dripping, dust sifting from the ceiling with distant impacts.
  vfx: Continuity damage on every costume.
  sound: Drips, distant muffled impacts above, a dying fluorescent buzz.
  dialogue: []
  transition: Cut.

- id: S07_020
  scene: "7.1"
  title: He let us walk away
  dur: 3.0
  location: BUNKER
  characters: [STRANGE, BATMAN]
  camera: Two-shot, 3 m.
  lens: 50 mm.
  movement: Locked.
  framing: Strange left, Batman right.
  action: Strange states it; Batman explains it.
  lighting: Red emergency light.
  environment: Drips.
  vfx: None.
  sound: Room tone.
  dialogue:
  - {who: STRANGE, line: "He let us walk away."}
  - {who: BATMAN, line: "He doesn't need to beat us. He needs us to keep fighting the wrong way."}
  transition: Cut.

- id: S07_030
  scene: "7.1"
  title: The hologram
  dur: 3.0
  location: BUNKER
  characters: [BATMAN]
  camera: Low, 4 m, the hologram between camera and heroes.
  lens: 35 mm.
  movement: Slow arc around the hologram.
  framing: The Engine hologram centre; faces lit blue around it.
  action: Batman throws a hologram of the Eternity Engine into the room; three points glow on it - CROWN, ROOT, HEART.
  lighting: Blue holo light on faces.
  environment: Dust in the holo beam.
  vfx: Engine hologram with labelled anchors.
  sound: Holo tone; score introduces a soft repeating tick.
  dialogue: []
  transition: Cut.

- id: S07_040
  scene: "7.1"
  title: Under half a second
  dur: 4.0
  location: BUNKER
  characters: [IRONMAN]
  camera: Medium close-up, 2 m.
  lens: 50 mm.
  movement: Locked.
  framing: Tony, helmet off, lit by the holo.
  action: Tony explains the window.
  lighting: Blue holo key.
  environment: None.
  vfx: Holo window graphic (0.4 s).
  sound: Tick continues.
  dialogue:
  - {who: TONY, line: "Three anchors. Crown, Root, Heart. They have to go dark inside the same window, and I mean narrow. Under half a second."}
  transition: Cut.

- id: S07_050
  scene: "7.1"
  title: And in order
  dur: 3.5
  location: BUNKER
  characters: [STRANGE]
  camera: Medium close-up, 2 m.
  lens: 50 mm.
  movement: Locked.
  framing: Strange, a small orange diagram of the order turning above his palm.
  action: Strange adds the order.
  lighting: Orange from the diagram, blue holo fill.
  environment: Sparks.
  vfx: Order diagram (Crown + Root, then Heart).
  sound: Spell chime.
  dialogue:
  - {who: STRANGE, line: "And in order. Crown and Root together, then the Heart, in the same heartbeat. Out of sequence, the fold collapses onto Earth."}
  transition: Cut.

- id: S07_060
  scene: "7.1"
  title: Someone has to be standing there
  dur: 3.5
  location: BUNKER
  characters: [CYBORG, FLASH]
  camera: Medium on Cyborg, then rack to the Flash behind.
  lens: 50 mm.
  movement: Rack focus.
  framing: Cyborg foreground right; Flash background left against the wall.
  action: Cyborg explains the gap; the Flash quietly volunteers.
  lighting: Red eye glow, emergency light.
  environment: None.
  vfx: Carrier-pulse waveform in Cyborg's eye.
  sound: Room tone.
  dialogue:
  - {who: CYBORG, line: "The anchors sync to a carrier pulse. I can ride it and open a gap in the Heart's shield, but somebody has to be standing there when it opens."}
  - {who: FLASH, line: "Half a second's a long time.", note: quietly}
  transition: Cut.

- id: S07_070
  scene: "7.1"
  title: A clock he can't read
  dur: 3.0
  location: BUNKER
  characters: [BATMAN, STRANGE]
  camera: Over-the-shoulder pair, 3 m.
  lens: 50 mm.
  movement: Locked.
  framing: Batman frame left, Strange right.
  action: Batman gives the counter-strategy; Strange makes it possible.
  lighting: Blue and orange.
  environment: None.
  vfx: Strange shows a single orange ring pulsing in time.
  sound: The tick locks to the ring's pulse.
  dialogue:
  - {who: BATMAN, line: "He reads everything we react to. So we don't react. We run this on a clock. Ours, not his."}
  - {who: STRANGE, line: "I can bind every one of you to a single count. Whatever he shows you, trust the count."}
  transition: Cut.

