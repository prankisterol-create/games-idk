sequence: 6
title: THANOS TURNS THE TIDE
target: 61.5
music: "6M1 'Causality' (reversed orchestra > dread pulse > Thanos motif in full > low strings only)"
purpose: >
  Each hero's best move fails for a reason the audience can see. Two realisations reframe
  the war (Tony: our strength feeds it; Batman: our perception is edited). End with the
  alliance on the edge of defeat, together under one shield.
locations: [CROSSING, SEVENTH_AVE, SIXTH_AVE, HARBOR]
shots:

- id: S06_010
  scene: "6.1"
  title: Reversal
  dur: 3.0
  location: CROSSING
  characters: [IRONMAN]
  camera: Wide, 4 m high, 35 m.
  lens: 28 mm.
  movement: Locked.
  framing: Iron Man left; collapsed building right.
  action: A missile flies backward into Iron Man's launcher; a fireball shrinks to a spark; a collapsed building rebuilds itself, stands whole for one second, then falls again.
  lighting: Fire light reversing.
  environment: Debris flowing upward into the building.
  vfx: Reversed rigid-body sim, then forward collapse.
  sound: Reversed impacts sucking inward, then the real collapse.
  dialogue: []
  transition: Cut.

- id: S06_020
  scene: "6.1"
  title: Beams bend away
  dur: 2.5
  location: CROSSING
  characters: [IRONMAN, THANOS]
  camera: Behind Iron Man's shoulder, 4 m behind him.
  lens: 35 mm.
  movement: Locked.
  framing: Iron Man frame left firing; Thanos centre-right.
  action: Iron Man fires; the beams bend around Thanos like light around a black hole.
  lighting: Repulsor light curving.
  environment: Smoke drawn around Thanos.
  vfx: Gravitational lensing on beams and background.
  sound: Beam whine bending in pitch.
  dialogue: []
  transition: Cut.

- id: S06_030
  scene: "6.2"
  title: The Flash in the loop
  dur: 3.0
  location: SEVENTH_AVE
  characters: [FLASH]
  camera: Tracking alongside the Flash at his speed (time-sliced so he reads), 3 m.
  lens: 35 mm.
  movement: Fast lateral track; the background repeats exactly.
  framing: Flash centre running screen right; newsstand, falling newspaper, red hydrant passing.
  action: He runs flat out; the same newsstand, newspaper and hydrant pass twice.
  lighting: Streetlights strobing past.
  environment: The repeated set dressing (identical frames).
  vfx: Background loop with identical plate repeats; lightning trail.
  sound: Speed whoosh; the same newspaper flutter twice.
  dialogue:
  - {who: FLASH, line: "No, no, no..."}
  transition: Cut.

- id: S06_040
  scene: "6.2"
  title: It's a loop
  dur: 1.5
  location: SEVENTH_AVE
  characters: [FLASH]
  camera: Medium, 3 m.
  lens: 50 mm.
  movement: Locked.
  framing: Flash skidding to a stop on the same corner.
  action: He stops, chest heaving.
  lighting: Streetlight.
  environment: Skid marks smoking.
  vfx: Residual arcs.
  sound: Heavy breathing.
  dialogue:
  - {who: FLASH, line: "It's a loop. The whole block's a loop."}
  transition: Cut.

- id: S06_050
  scene: "6.3"
  title: Spider-sense fails
  dur: 2.5
  location: SIXTH_AVE
  characters: [SPIDEY]
  camera: Close-up, 1.2 m.
  lens: 50 mm.
  movement: Slow push.
  framing: Spider-Man clinging to a lamppost; ghost-echoes around him.
  action: Ghost-echoes of things that already happened flicker around him; his lenses go wide.
  lighting: Violet, flickering.
  environment: Echo copies of moving debris.
  vfx: Translucent temporal echoes, lens widening.
  sound: Spider-sense tone stuttering and doubling.
  dialogue:
  - {who: SPIDEY, line: "It's going off for everything. For stuff that already happened. I can't tell what's coming!"}
  transition: Cut.

