- id: S06_130
  scene: "6.5"
  title: Tony realises
  dur: 3.0
  location: CROSSING
  characters: [IRONMAN]
  camera: Inside the helmet, 0.25 m.
  lens: 24 mm.
  movement: Slow push on his eyes.
  framing: Tony's face; two graphs overlaid on the HUD.
  action: Hero attacks and the Engine's output overlay; every spike matches.
  lighting: Blue HUD, red spikes.
  environment: None.
  vfx: HUD graphs (attack log vs Engine output).
  sound: Data ticks; score drops.
  dialogue:
  - {who: TONY, line: "Every hit we land, that thing gets stronger."}
  - {who: TONY, line: "He wanted us swinging."}
  transition: Cut.

- id: S06_140
  scene: "6.6"
  title: Batman realises
  dur: 2.5
  location: CROSSING
  characters: [BATMAN]
  camera: Close behind cover, 1.5 m.
  lens: 50 mm.
  movement: Locked.
  framing: Batman crouched behind a car, gauntlet log glowing.
  action: His log shows a grapple shot recorded landing before it was fired.
  lighting: Gauntlet light.
  environment: Rain.
  vfx: Gauntlet display with inverted timestamps.
  sound: Quiet.
  dialogue:
  - {who: BATMAN, line: "His Stones aren't just bending space. He's editing what we see. Cause and effect, out of order."}
  transition: Cut.

