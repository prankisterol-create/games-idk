sequence: 10
title: THE FINAL GAMBIT
target: 65.0
music: "10M1 'The Gambit' (merged theme at full force, Thanos motif fighting it; music falls away completely at the collapse so the mechanism dominates; absolute silence on the wave)"
purpose: >
  Win through intelligence and teamwork, not a power-up: force Thanos to choose between
  holding the Engine and fighting. Every hero performs one specific, earned task. The
  near-sacrifice is established clearly and left unresolved until Sequence 11.
locations: [PLATFORM, HEART, CAUSEWAY]
shots:

- id: S10_010
  scene: "10.1"
  title: The collapse stalls
  dur: 3.0
  location: PLATFORM
  characters: [IRONMAN, BATMAN, CYBORG]
  camera: Medium-wide on the platform, 6 m.
  lens: 35 mm.
  movement: Locked.
  framing: Iron Man dropping onto the platform beside Batman; console readout; Heart beyond.
  action: Iron Man lands; the collapse stalls on the console; the Heart's shell begins to re-form.
  lighting: Console light, re-forming purple shell.
  environment: Shell re-forming in the background.
  vfx: Readout reversing; shell reconstitution.
  sound: Collapse sound reversing into a rising hum.
  dialogue:
  - {who: CYBORG, line: "He's feeding it from the Stones. It's holding!"}
  transition: Cut.

- id: S10_020
  scene: "10.1"
  title: Make him choose
  dur: 4.0
  location: PLATFORM
  characters: [STRANGE, BATMAN, IRONMAN]
  camera: Three-shot around the console, 3 m.
  lens: 40 mm.
  movement: Slow arc.
  framing: Strange, Batman, Tony around the console.
  action: Strange explains why the Stones can't be taken; Batman finds the move.
  lighting: Console blue, purple shell.
  environment: Platform trembling.
  vfx: Loop diagram on the console.
  sound: Tense pulse.
  dialogue:
  - {who: STRANGE, line: "The Stones are fused into the loop. Tear them out and the loop takes Earth with them."}
  - {who: BATMAN, line: "Then we make him choose. Every control point at once. He can hold the Engine or he can fight us. Not both."}
  transition: Cut.

