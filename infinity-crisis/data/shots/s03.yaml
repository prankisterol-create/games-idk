  framing: Strange centre, mandala filling the frame; Spider-Man and the paramedic behind him.
  action: Strange throws up his hands; an orange mandala blooms and the wave breaks against it like surf.
  lighting: Orange spell light against purple wave.
  environment: Debris breaking off the shield.
  vfx: Layered mandala geometry, wave impact.
  sound: Spell activation chime and roar of the wave breaking.
  dialogue: []
