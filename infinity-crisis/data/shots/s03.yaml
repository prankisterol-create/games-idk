- id: S03_220
  scene: "3.2"
  title: The Engine revealed
  dur: 3.0
  location: CROSSING
  characters: [THANOS, CAP, IRONMAN, THOR, HULK, SPIDEY, STRANGE]
  camera: Wide behind the Avengers, 4 m high.
  lens: 24 mm.
  movement: Slow push into the rupture.
  framing: Heroes small at frame bottom; rupture behind them; the Engine tiny and colossal inside.
  action: Thanos gestures; space tears open behind the heroes, revealing a colossal machine turning in a starless void.
  lighting: Engine's violet-white glow spilling onto the street.
  environment: Air rushing into the rupture.
  vfx: Rupture, Engine distant plate with gravitational lensing.
  sound: Vast low resonance; choir cluster.
  dialogue: []
  transition: Cut.

- id: S03_230
  scene: "3.2"
  title: What is that?
  dur: 2.0
  location: CROSSING
  characters: [SPIDEY, STRANGE]
  camera: Medium two-shot, 3 m.
  lens: 50 mm.
  movement: Locked.
  framing: Spider-Man and Strange looking into the rupture, lit by it.
  action: They stare.
  lighting: Violet-white Engine light.
  environment: Wind.
  vfx: None.
  sound: Resonance under dialogue.
  dialogue:
  - {who: SPIDEY, line: "What is that?"}
  - {who: STRANGE, line: "Something that isn't in our universe.", note: quietly}
  transition: Cut.

- id: S03_240
  scene: "3.3"
  title: The second tear
  dur: 2.0
  location: MIDTOWN_SKY
  characters: []
  camera: Wide on the clouds above the city.
  lens: 35 mm.
  movement: Locked.
  framing: Clouds; a blue-white seam opening upper centre.
  action: A second tear splits the clouds, blue-white, not violet.
  lighting: Blue-white light against violet sky.
  environment: Clouds pushed apart.
  vfx: Second rupture (different color, cleaner edge).
  sound: A clear high tone cuts through the drone.
  dialogue: []
