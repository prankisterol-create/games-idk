- id: S03_250
  scene: "3.3"
  title: Superman descends
  dur: 2.5
  location: MIDTOWN_SKY
  characters: [SUPERMAN]
  camera: Below the clouds, looking up, 400 m.
  lens: 85 mm.
  movement: Locked, then tilt down as he accelerates past.
  framing: Small red-and-blue figure emerging from the tear, growing.
  action: Superman descends through the cloud, accelerating; a sonic boom ring.
  lighting: Natural-daylight quality around him (blue-white tear), cape catching light.
