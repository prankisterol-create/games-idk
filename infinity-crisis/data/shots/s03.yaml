- id: S03_210
  scene: "3.2"
  title: The same illusion
  dur: 3.0
  location: CROSSING
  characters: [THANOS, STRANGE]
  camera: Close-up on the gauntlet, then rack to Strange's face.
  lens: 100 mm.
  movement: Locked; rack focus.
  framing: Gauntlet foreground; Strange soft behind, then sharp.
  action: Thanos slowly closes his hand; cracks race across the mandala.
  lighting: Stones glinting; orange spell light flickering.
  environment: Mandala fragments.
  vfx: Crack propagation on the spell geometry.
  sound: Glass-like spell cracking.
  dialogue:
  - {who: THANOS, line: "Different names for the same illusion."}
