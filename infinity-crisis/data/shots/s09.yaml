  dur: 3.0
  location: CAUSEWAY
  characters: [THANOS]
  camera: Wide, low, 40 m, side-on.
  lens: 28 mm.
  movement: Locked; shake on impact.
  framing: Thanos landing frame left on the floating causeway; platform far right.
  action: He lands; the structure around him breaks apart; fragments drift upward in the low gravity.
  lighting: Violet core light from frame right.
  environment: Fragments rising slowly.
  vfx: Low-gravity debris.
  sound: Impact boom, then the eerie tick of drifting stones.
