sequence: 9
title: SUPERMAN, THOR, AND WONDER WOMAN VS. THANOS
target: 65.0
music: "9M1 'Three Against the Titan' (percussion-led combat, each hero's motif on contact, Thanos motif gaining; strings hold under 'buying time')"
purpose: >
  A spatially locked three-on-one: Thanos always on screen left driving right toward the
  platform; the heroes always between him and it. Every exchange shows anticipation,
  contact, follow-through, recovery and reaction. He wins the fight; they win the time.
staging: >
  Screen direction locked for the whole sequence: Thanos LEFT, heroes CENTRE, control
  platform and Heart RIGHT (background). Any shot that crosses the line is a deliberate
  reverse marked in its transition field.
locations: [CAUSEWAY, PLATFORM]
shots:

