- id: S04_240
  scene: "4.6"
  title: Every layer of reality
  dur: 3.0
  location: CROSSING
  characters: [STRANGE]
  camera: Medium, 3 m, through the layered mandala.
  lens: 50 mm.
  movement: Slow push through the panes.
  framing: Strange centre; stacked panes of light receding behind him.
  action: Strange unfolds a mandala into layered panes of light, every pane cracking along the same line.
  lighting: Orange spell light.
  environment: Sparks.
  vfx: Stacked dimensional panes, synchronized cracks.
  sound: Layered glass resonance.
  dialogue:
  - {who: STRANGE, line: "The fracture isn't just here. It runs through every layer of reality I can see. Ours. Theirs. All of them."}
  transition: Cut.

