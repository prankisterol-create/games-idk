sequence: 4
title: THE JUSTICE LEAGUE ARRIVES
target: 66.5
music: "4M1 'Dawn' (Justice League horn call > strain > arrival fanfare > uneasy strings > merged motif)"
purpose: >
  Superman arrives as hope with limits. Thanos withdraws on his own terms. Two teams that do
  not trust each other find common ground through evidence, not speeches, and close ranks.
locations: [HOSPITAL, MIDTOWN_SKY, CROSSING]
shots:

- id: S04_010
  scene: "4.1"
  title: The cruiser falls toward the hospital
  dur: 3.0
  location: HOSPITAL
  characters: [MONOLITH, HOSPITAL_STAFF]
  camera: Hospital roof level, 30 m from the roof edge, looking up.
  lens: 24 mm.
  movement: Locked, slow tilt up.
  framing: Roof with nurses and beds in the lower third; the cruiser's hull filling the sky.
  action: A crippled Monolith cruiser drops toward the hospital; nurses push beds toward a stairwell; a doctor looks up and stops.
  lighting: Cruiser underside fires, helipad floodlights, violet sky.
  environment: Downdraft blowing sheets and IV stands; rain.
  vfx: Cruiser descent, burning hull sections.
  sound: Rising engine failure shriek, beds' wheels, shouting.
  dialogue: []
  transition: Cut on Superman's impact (blur of red and blue entering frame).

- id: S04_020
  scene: "4.2"
  title: The weight
  dur: 2.5
  location: HOSPITAL
  characters: [SUPERMAN]
  camera: Close-up under the hull, 2 m from Superman, looking up past him.
  lens: 35 mm.
  movement: Camera sinks with him as the weight drives him down.
  framing: Superman's face and arms centre; hull filling frame top.
  action: His hands sink into the metal; the weight drives him down; teeth bared, body shaking; hull groaning.
  lighting: Warm fire bounce on his face, blue-white rim (daylight quality).
  environment: Sparks raining off the hull, cape snapping.
  vfx: Hull deformation around his hands, sparks.
  sound: Deep metallic groan, his strained breath, the score's horn call held under strain.
  dialogue: []
  transition: Cut.

- id: S04_030
  scene: "4.3"
  title: It stops
  dur: 2.5
  location: HOSPITAL
  characters: [SUPERMAN, HOSPITAL_STAFF]
  camera: Roof level, low, 20 m.
  lens: 28 mm.
  movement: Locked.
  framing: Staff on the roof in the foreground; prow above them, Superman under it.
  action: The prow sinks to five meters above the roof and stops; Superman roars; the ship begins to rise.
  lighting: Same.
  environment: Downdraft reverses as it rises.
  vfx: Hull motion, roof debris.
  sound: Roar, metal shudder, horn call breaks through into the heroic motif.
  dialogue: []
  transition: Cut.

- id: S04_040
  scene: "4.4"
  title: Carrying the ship
  dur: 3.5
  location: MIDTOWN_SKY
  characters: [SUPERMAN, MONOLITH]
  camera: Tracking from behind and below Superman, 12 m back.
  lens: 24 mm.
  movement: Fast follow, rising with him.
  framing: Superman centre; city lights sliding away beneath; black hull filling the sky above.
  action: He drives the cruiser up and over the city toward an empty industrial zone by the water.
  lighting: Hull fires above, city glow below.
  environment: Smoke trailing off the hull.
  vfx: Hull fire trail, city plate.
  sound: Wind roar, hull groan, score building.
  dialogue: []
  transition: Cut.

- id: S04_050
  scene: "4.4"
  title: Release
  dur: 2.0
  location: MIDTOWN_SKY
  characters: [SUPERMAN, MONOLITH]
  camera: Wide from above, 300 m.
  lens: 50 mm.
  movement: Locked.
  framing: Superman upper frame; cruiser arcing down into a dark industrial grid lower right.
  action: He lets go; the cruiser falls into the empty district and erupts in a distant fireball.
  lighting: Fireball.
  environment: Shock ring in smoke.
  vfx: Distant explosion, no structures with people.
  sound: Delayed explosion boom (1.2 s).
  dialogue: []
  transition: Cut.

- id: S04_060
  scene: "4.4"
  title: He sees Thanos
  dur: 2.0
  location: MIDTOWN_SKY
  characters: [SUPERMAN]
  camera: Medium, then POV down at the intersection.
  lens: 50 mm then 135 mm POV.
  movement: Cape swirl turn, then POV push-in.
  framing: Superman turning; POV shows the Crossing far below with Thanos and fallen heroes.
  action: Superman turns in midair and sees Thanos standing among fallen heroes.
  lighting: Fire glow from below.
  environment: Smoke.
  vfx: Long-lens POV with heat haze.
  sound: Wind; score drops to a tense pulse.
  dialogue: []
  transition: Cut.

- id: S04_070
  scene: "4.5"
  title: Superman lands
  dur: 3.0
  location: CROSSING
  characters: [SUPERMAN, THANOS, CAP, IRONMAN, THOR, HULK, SPIDEY, STRANGE]
  camera: Low wide, behind the injured Avengers, 1 m high.
  lens: 28 mm.
  movement: Locked; dust shake.
  framing: Avengers in the foreground; Superman lands centre between them and Thanos (right).
  action: Superman lands; the ground dishes; a dust ring rolls out; his cape settles slowly.
  lighting: Fire and violet; Superman rimmed in cleaner, whiter light.
  environment: Dust ring, cape settle in wind.
  vfx: Landing crater, dust, cape cloth sim.
  sound: Heavy but controlled landing thud, then quiet.
  dialogue: []
  transition: Cut.

- id: S04_080
  scene: "4.5"
  title: Another champion
  dur: 2.5
  location: CROSSING
  characters: [THANOS, SUPERMAN]
  camera: Over Superman's shoulder at Thanos, 5 m.
  lens: 50 mm.
  movement: Locked.
  framing: Superman's shoulder and cape frame left; Thanos right.
  action: Thanos looks him over, unimpressed.
  lighting: Violet key on Thanos.
  environment: Embers.
  vfx: None.
  sound: Score holds.
  dialogue:
  - {who: THANOS, line: "Another champion."}
  transition: Cut.

- id: S04_090
  scene: "4.5"
  title: Go through us
  dur: 3.5
  location: CROSSING
  characters: [SUPERMAN]
  camera: Low-angle hero shot, 2 m, 0.8 m high.
  lens: 35 mm.
  movement: Slow push-in.
  framing: Superman centre, sky behind.
  action: Superman answers calmly.
  lighting: Natural daylight-quality key on Superman, warm fill, the blue-white tear behind him.
  environment: Cape moving in the wind.
  vfx: None.
  sound: Score silent under the line.
  dialogue:
  - {who: SUPERMAN, line: "If you're here to hurt this world, you're going to have to go through us."}
  transition: Cut on lightning.

