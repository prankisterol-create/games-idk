- id: S04_160
  scene: "4.5"
  title: Bring them all
  dur: 3.0
  location: CROSSING
  characters: [THANOS, HOLLOWS]
  camera: Medium close-up on Thanos, 4 m.
  lens: 50 mm.
  movement: Locked, then he steps out of frame into the rupture.
  framing: Thanos centre; rupture behind.
  action: Thanos regards them all with the faintest smile, steps backward into his rupture, and it seals. The Hollows rise and withdraw.
  lighting: Violet.
  environment: Rupture closing pulls embers inward.
  vfx: Rupture closing.
  sound: Rupture implodes with a soft thump; Hollows' feet.
  dialogue:
  - {who: THANOS, line: "Good. Bring them all."}
  transition: Cut.

- id: S04_170
