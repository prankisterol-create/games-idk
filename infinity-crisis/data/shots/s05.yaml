sequence: 5
title: THE FIRST GREAT COMBINED BATTLE
target: 90.5
music: "5M1 'Alliance in Motion' (merged theme at tempo; each zone keeps its own instrument family; false-victory swell; freeze to a single tone)"
purpose: >
  Five interconnected zones, each with its own beginning, middle and end, cross-cut on
  clear screen directions (sky = up, waterfront = screen right, rescue = screen left). Every
  zone pays off a pairing of powers. The win is real enough to believe, so the freeze lands.
zones:
  A: "SKY_A - the sky over the harbor (Iron Man, Green Lantern, Superman, Thor)"
  B: "MADISON - the street defense line (Captain America, Wonder Woman)"
  C: "WATERFRONT - the Brooklyn waterfront ruins (Hulk, Aquaman vs the Leviathan)"
  D: "DIM_FRONT - the dimensional front rooftop (Batman, Doctor Strange, Cyborg)"
  E: "RESCUE / CORRIDOR - the evacuation (Flash, Spider-Man, Black Panther)"
locations: [AERIAL, CROSSING, SKY_A, MADISON, WATERFRONT, DIM_FRONT, RESCUE, CORRIDOR]
shots:

